[package]
name = "claudectx"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
colored = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
